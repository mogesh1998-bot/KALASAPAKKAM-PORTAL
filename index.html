<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalasapakkam Block Portal</title>
    <!-- கூகுள் ஃபான்ட்கள் இணைப்பு -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: #334155;
            --accent-color: #3b82f6;
            
            /* 🌌 அனிமேஷன் வண்ணங்கள் (Default Theme) */
            --gradient-1: #0f172a;
            --gradient-2: #1e3a8a;
            --gradient-3: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --header-bg: rgba(15, 23, 42, 0.6);
        }

        [data-theme="ocean"] {
            --accent-color: #64ffda;
            --gradient-1: #0a192f;
            --gradient-2: #172a45;
            --gradient-3: #020c1b;
            --card-bg: rgba(23, 42, 69, 0.6);
            --header-bg: rgba(2, 12, 27, 0.6);
        }

        [data-theme="cyber"] {
            --accent-color: #00f5ff;
            --gradient-1: #120136;
            --gradient-2: #400082;
            --gradient-3: #03001e;
            --card-bg: rgba(3, 0, 30, 0.6);
            --header-bg: rgba(18, 1, 54, 0.6);
        }

        [data-theme="solar"] {
            --accent-color: #f59e0b;
            --gradient-1: #1c1c1c;
            --gradient-2: #451a03;
            --gradient-3: #2d2d2d;
            --card-bg: rgba(45, 45, 45, 0.6);
            --header-bg: rgba(28, 28, 28, 0.6);
        }

        body {
            font-family: 'Poppins', 'Noto Sans Tamil', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
            min-height: 100vh;
            
            /* ✨ நகரும் அனிமேஷன் பின்னணி */
            background: linear-gradient(-45deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .theme-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .theme-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-glow);
            background-color: var(--card-bg);
            color: var(--text-main);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .theme-btn:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: var(--header-bg);
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        header h1 { margin: 0; font-size: 2.2rem; font-weight: 700; color: #ffffff; }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-color);
            margin: 30px 0 15px 0;
            padding-left: 12px;
            border-left: 4px solid var(--accent-color);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-glow);
            transition: all 0.25s ease-in-out;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background-color: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .card-info { display: flex; flex-direction: column; }
        .card h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .card p { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }
        footer { text-align: center; margin-top: 50px; padding: 20px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-glow); }
    </style>
</head>
<body>

<div class="container">
    <div class="theme-switcher">
        <button class="theme-btn" onclick="setTheme('default')">🌑 Dark Default</button>
        <button class="theme-btn" onclick="setTheme('ocean')">🌊 Ocean Breeze</button>
        <button class="theme-btn" onclick="setTheme('cyber')">👾 Cyberpunk</button>
        <button class="theme-btn" onclick="setTheme('solar')">☀️ Solar Eclipse</button>
    </div>

    <header>
        <h1>கலாசபாக்கம் வட்டார போர்டல்</h1>
    </header>

    <div class="section-title">🔑 முக்கிய லாகின் போர்ட்டல்கள்</div>
    <div class="grid">
        <a href="https://tn.gov.in" target="_blank" class="card">
            <div class="icon-box">🏡</div>
            <div class="card-info">
                <h3>VP TAX Portal</h3>
                <p>ஊராட்சி சொத்து வரி மற்றும் சேவைகள்</p>
            </div>
        </a>

        <a href="https://egramswaraj.gov.in" target="_blank" class="card">
            <div class="icon-box">🏛️</div>
            <div class="card-info">
                <h3>E-Gramswaraj</h3>
                <p>மத்திய அரசு கிராம கணக்கு போர்டல்</p>
            </div>
        </a>

        <a href="https://indianbank.bank.in" target="_blank" class="card">
            <div class="icon-box">💳</div>
            <div class="card-info">
                <h3>TN PASS Login</h3>
                <p>Indian Bank TNDRD-PRI போர்டல்</p>
            </div>
        </a>
    </div>

    <footer>
        <p>© 2026 Kalasapakkam Block Portal | Designed for Quick Access</p>
    </footer>
</div>

<script>
    function setTheme(themeName) {
        if(themeName === 'default') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', themeName);
        }
    }
</script>
</body>
</html>
