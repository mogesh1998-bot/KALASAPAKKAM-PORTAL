<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalasapakkam Block Portal</title>
    <!-- கூகுள் ஃபான்ட்கள் இணைப்பு -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            
            /* 🌌 அனிமேஷன் வண்ணங்கள் (Default Theme) */
            --gradient-1: #0f172a;
            --gradient-2: #1e3a8a;
            --gradient-3: #020617;
            --card-bg: rgba(30, 41, 59, 0.4);
            --header-bg: rgba(15, 23, 42, 0.5);
            --particle-color: rgba(255, 255, 255, 0.3);
        }

        [data-theme="ocean"] {
            --accent-color: #64ffda;
            --gradient-1: #0a192f;
            --gradient-2: #172a45;
            --gradient-3: #020c1b;
            --card-bg: rgba(23, 42, 69, 0.4);
            --header-bg: rgba(2, 12, 27, 0.5);
            --particle-color: rgba(100, 255, 218, 0.3);
        }

        [data-theme="cyber"] {
            --accent-color: #00f5ff;
            --gradient-1: #120136;
            --gradient-2: #400082;
            --gradient-3: #03001e;
            --card-bg: rgba(3, 0, 30, 0.4);
            --header-bg: rgba(18, 1, 54, 0.5);
            --particle-color: rgba(0, 245, 255, 0.3);
        }

        [data-theme="solar"] {
            --accent-color: #f59e0b;
            --gradient-1: #1c1c1c;
            --gradient-2: #451a03;
            --gradient-3: #171717;
            --card-bg: rgba(45, 45, 45, 0.4);
            --header-bg: rgba(28, 28, 28, 0.5);
            --particle-color: rgba(245, 158, 11, 0.3);
        }

        body {
            font-family: 'Poppins', 'Noto Sans Tamil', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            
            /* ✨ 1. வண்ண அலைகள் நகரும் அனிமேஷன் */
            background: linear-gradient(-45deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🌌 2. பின்னணியில் மிதக்கும் ஒளிரும் துகள்கள் (Star Particles Effect) */
        .background-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background-color: var(--particle-color);
            border-radius: 50%;
            animation: floatParticles 8s infinite linear;
            box-shadow: 0 0 10px var(--particle-color);
        }

        /* துகள்கள் வெவ்வேறு அளவுகளில் ஒளிரும் குறியீடு */
        .p1 { width: 3px; height: 3px; left: 10%; top: 20%; animation-duration: 6s; }
        .p2 { width: 5px; height: 5px; left: 30%; top: 70%; animation-duration: 9s; animation-delay: 1s; }
        .p3 { width: 2px; height: 2px; left: 75%; top: 15%; animation-duration: 5s; animation-delay: 2s; }
        .p4 { width: 4px; height: 4px; left: 85%; top: 60%; animation-duration: 8s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 50%; top: 40%; animation-duration: 7s; animation-delay: 4s; }

        @keyframes floatParticles {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }

        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        .theme-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .theme-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-glow);
            background-color: var(--card-bg);
            color: var(--text-main);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .theme-btn:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: var(--header-bg);
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 { margin: 0; font-size: 2.2rem; font-weight: 700; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-color);
            margin: 30px 0 15px 0;
            padding-left: 12px;
            border-left: 4px solid var(--accent-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        /* 💎 3. கார்டுகளுக்கான புதிய 3D கிளாஸ்மார்பிசம் எஃபெக்ட் (Glassmorphism & Hover Effect) */
        .card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-glow);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* மவுஸ் அல்லது தொடுதிரை எஃபெக்ட் (Hover Lift & Glow) */
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--accent-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px var(--accent-color);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .card:hover .icon-box {
            transform: rotate(10deg) scale(1.1);
        }

        .card-info { display: flex; flex-direction: column; }
        .card h3 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.3px; }
        .card p { margin: 5px 0 0 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
        
        footer { text-align: center; margin-top: 60px; padding: 20px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-glow); }
    </style>
</head>
<body>

<!-- பின்னணி நட்சத்திரங்கள் வடிவமைப்பு -->
<div class="background-particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
</div>

<div class="container">
    <div class="theme-switcher">
        <button class="theme-btn" onclick="setTheme('default')">🌑 Dark Default</button>
        <button class="theme-btn" onclick="setTheme('ocean')">🌊 Ocean Breeze</button>
        <button class="theme-btn" onclick="setTheme('cyber')">👾 Cyberpunk</button>
        <button class="theme-btn" onclick="setTheme('solar')">☀️ Solar Eclipse</button>
    </div>

    <header>
        <h1>கலசபாக்கம் வட்டாரம்</h1>
    </header>

    <div class="section-title">🔑 முக்கிய லாகின் போர்ட்டல்கள்</div>
    <div class="grid">
        <a href="https://tn.gov.in" target="_blank" class="card">
            <div class="icon-box">🏡</div>
            <div class="card-info">
                <h3>VP TAX Portal</h3>
                <p>ஊராட்சி சொத்து வரி மற்றும் சேவைகள்</p>
            </div>
        </a>

        <a href="https://egramswaraj.gov.in" target="_blank" class="card">
            <div class="icon-box">🏛️</div>
            <div class="card-info">
                <h3>E-Gramswaraj</h3>
                <p>மத்திய அரசு கிராம கணக்கு போர்டல்</p>
            </div>
        </a>

        <a href="https://indianbank.bank.in" target="_blank" class="card">
            <div class="icon-box">💳</div>
            <div class="card-info">
                <h3>TN PASS Login</h3>
                <p>Indian Bank TNDRD-PRI போர்டல்</p>
            </div>
        </a>
    </div>

    <footer>
        <p>© 2026 Kalasapakkam Block Portal | Designed for Quick Access</p>
    </footer>
</div>
